<!-- wallet.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect Wallet – LaunchCoin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="glass">
    <!-- header invariato -->
  </header>

  <div class="wallet-modal glass">
    <h2>Connect Wallet</h2>
    <p class="wallet-sub">Choose your preferred wallet</p>
    
    <!-- Pulsante che apre il modale Web3Modal -->
    <button class="connect-btn" onclick="window.connectWallet()">Connect Wallet</button>
    
    <!-- Se vuoi mantenere l'elenco, lascia i pulsanti che chiamano connectWallet -->
    <ul>
      <li><button onclick="window.connectWallet()"><img src="assets/phantom.png" /> Phantom</button></li>
      <li><button onclick="window.connectWallet()"><img src="assets/solflare.png" /> Solflare</button></li>
      <!-- ... altri wallet ... -->
    </ul>
    
    <button class="back" onclick="window.location.href='index.html'">← Back</button>
  </div>

  <!-- Carica il modulo main.js (il codice sopra) -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
