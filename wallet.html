<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
  <title>Connect Wallet – LaunchCoin</title>
  <link rel="stylesheet" href="style.css" />
  
  <!-- QRCode libreria – OBBLIGATORIA -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
  <header class="glass">
    <div class="logo"><img src="assets/logo.png" alt="LaunchCoin" class="logo-header" /></div>
    <div class="menu-wrapper">
      <button class="hamburger" onclick="window.toggleMenu()">☰</button>
      <nav class="dropdown-menu" id="dropdownMenu">
        <a href="create.html">Create Token</a>
        <a href="liquidity.html">Create Liquidity</a>
        <a href="faq.html">How to use</a>
        <a href="faq.html">FAQ</a>
      </nav>
    </div>
    <button class="connect-btn" onclick="window.connectWallet()">Connect</button>
  </header>

  <div class="wallet-modal glass">
    <h2>CoinFlip</h2>
    <p class="wallet-sub">to continue</p>
    
    <!-- QR CONTAINER -->
    <div id="qr-container" style="display: none; margin: 16px 0; padding: 20px; background: rgba(0,0,0,0.3); border-radius: 16px;">
      <h3 style="color: #22d1f8; font-size: 18px; margin-bottom: 8px;">WalletConnect</h3>
      <p style="color: #abc4ff; font-size: 13px; margin-bottom: 12px;">Scan this QR Code with your phone</p>
      <div id="qr-code" style="display: flex; justify-content: center; background: white; padding: 12px; border-radius: 12px; min-height: 180px; align-items: center;">
        <span style="color: #888; font-size: 14px;">⏳ Generating QR...</span>
      </div>
      <button onclick="window.closeQR()" style="margin-top: 12px; background: #ff4ea3; border: none; padding: 8px 20px; border-radius: 40px; font-weight: 600; color: white; cursor: pointer; font-size: 13px;">✕ Close</button>
    </div>
    
    <ul>
      <li><button onclick="window.selectWallet('phantom')"><img src="assets/phantom.png" alt="Phantom" /> Phantom</button></li>
      <li><button onclick="window.selectWallet('solflare')"><img src="assets/solflare.png" alt="Solflare" /> Solflare</button></li>
      <li><button onclick="window.selectWallet('trust')"><img src="assets/trust.png" alt="Trust Wallet" /> Trust Wallet</button></li>
      <li><button onclick="window.selectWallet('coinbase')"><img src="assets/coinbase.png" alt="Coinbase Wallet" /> Coinbase Wallet</button></li>
      <li><button onclick="window.selectWallet('backpack')"><img src="assets/backpack.png" alt="Backpack" /> Backpack</button></li>
      <li><button onclick="window.selectWallet('nightly')"><img src="assets/nightly.png" alt="Nightly" /> Nightly</button></li>
      <li><button onclick="window.selectWallet('torus')"><img src="assets/torus.png" alt="Torus" /> Torus</button></li>
      <li><button onclick="window.selectWallet('tokenpocket')"><img src="assets/tokenpocket.png" alt="TokenPocket" /> TokenPocket</button></li>
      <li><button onclick="window.selectWallet('neko')"><img src="assets/neko.png" alt="Neko" /> Neko</button></li>
      <li><button onclick="window.selectWallet('glow')"><img src="assets/glow.png" alt="Glow" /> Glow</button></li>
    </ul>
    <button class="back" onclick="window.location.href='index.html'">← Back</button>
  </div>

  <!-- SOLO QUESTO SCRIPT MODULO -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
