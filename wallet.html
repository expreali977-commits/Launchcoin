<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connetti Wallet – LaunchCoin</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
  <header class="glass">
    <div class="logo"><img src="assets/logo.png" alt="LaunchCoin" class="logo-header" /></div>
    <div class="menu-wrapper">
      <button class="hamburger" onclick="toggleMenu()">☰</button>
      <nav class="dropdown-menu" id="dropdownMenu">
        <a href="create.html">Create Token</a>
        <a href="liquidity.html">Create Liquidity</a>
        <a href="faq.html">How to use</a>
        <a href="faq.html">FAQ</a>
      </nav>
    </div>
    <button class="connect-btn" onclick="connectWallet()">Connect</button>
  </header>

  <div class="wallet-modal glass">
    <h2>Connetti Wallet</h2>
    <p class="wallet-sub">Scegli il tuo wallet preferito</p>

    <div id="qr-container" style="display:none; margin:16px 0; padding:20px; background:rgba(0,0,0,0.3); border-radius:16px;">
      <h3 style="color:#22d1f8; font-size:18px; margin-bottom:8px;">WalletConnect QR</h3>
      <p style="color:#abc4ff; font-size:13px; margin-bottom:12px;">Scansiona con la tua app wallet</p>
      <div id="qr-code" style="display:flex; justify-content:center; background:white; padding:12px; border-radius:12px; min-height:180px; align-items:center;">
        <span style="color:#888;">Generazione QR...</span>
      </div>
      <button onclick="chiudiQR()" style="margin-top:12px; background:#ff4ea3; border:none; padding:8px 20px; border-radius:40px; font-weight:600; color:white; cursor:pointer;">✕ Chiudi</button>
    </div>

    <ul>
      <li><button onclick="connettiWallet('phantom')"><img src="assets/phantom.png" alt="Phantom" /> Phantom</button></li>
      <li><button onclick="connettiWallet('solflare')"><img src="assets/solflare.png" alt="Solflare" /> Solflare</button></li>
      <li><button onclick="connettiWallet('trust')"><img src="assets/trust.png" alt="Trust" /> Trust Wallet</button></li>
      <li><button onclick="connettiWallet('coinbase')"><img src="assets/coinbase.png" alt="Coinbase" /> Coinbase</button></li>
      <li><button onclick="connettiWallet('backpack')"><img src="assets/backpack.png" alt="Backpack" /> Backpack</button></li>
      <li><button onclick="connettiWallet('nightly')"><img src="assets/nightly.png" alt="Nightly" /> Nightly</button></li>
      <li><button onclick="connettiWallet('glow')"><img src="assets/glow.png" alt="Glow" /> Glow</button></li>
      <li><button onclick="mostraQR()"><span style="font-size:24px;">📱</span> WalletConnect (QR)</button></li>
    </ul>
    <button class="back" onclick="window.location.href='index.html'">← Torna indietro</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
